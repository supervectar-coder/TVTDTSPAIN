<title>SV TDT ESPAÑA</title>

<style>
:root{
  --bg:#ffffff;
  --card:#f5f5f5;
  --muted:#555;
  --highlight:#e60000;
  --font-size:16px;
}

body{
  font-family:Inter,system-ui;
  background:#ffffff;
  color:#111;
  margin:0;
  padding:16px;
  font-size: var(--font-size);
  overflow-x:hidden;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:16px;
}

h1{
  font-size:20px;
  margin:0;
  color:var(--highlight);
  font-weight:900;
}

input[type=search], select{
  padding:12px 16px;
  border-radius:10px;
  border:1px solid #ccc;
  background:#fff;
  color:#000;
  font-weight:bold;
  font-size:16px;
}

h2{
  margin-top:24px;
  color:var(--highlight);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;
  scroll-behavior:smooth;
  overflow-x:auto;
}

.card{
  cursor:pointer;
  border-radius:8px;
  overflow:hidden;
  outline:none;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:var(--card);
  padding:8px;
}

.card:hover, .card:focus{
  transform: scale(1.05);
  box-shadow:0 8px 20px rgba(230,0,0,0.4);
}

.img{
  width:100%;
  max-height:120px;
  object-fit:contain;
  border-radius:8px;
  background:#fff;
  display:block;
  margin-bottom:8px;
  transition: transform 0.2s ease;
}

.card:hover img{
  transform: scale(1.08);
}

.title{
  font-weight:700;
  font-size:14px;
  margin-top:4px;
  text-align:center;
}

.meta{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
  text-align:center;
}

.pagination{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:12px;
}

.pagination button{
  padding:10px 14px;
  border-radius:6px;
  border:1px solid #ccc;
  background:transparent;
  color:#000;
  cursor:pointer;
  font-size:14px;
}

.pagination button.active{
  background:var(--highlight);
  color:#fff;
}

.pagination button:hover, .pagination button:focus{
  background:var(--highlight);
  color:#fff;
  outline:none;
}

.grid::-webkit-scrollbar{
  display:none;
}
</style>
</head>

const moviesEl = document.getElementById('movies-grid');

function renderMovies(data){
  moviesEl.innerHTML='';
  data.forEach(item=>{
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`
      <img loading="lazy" class="img" src="${item.poster}">
      <div class="title">${item.title}</div>
      <div class="meta">${item.year} • ${item.genre}</div>
    `;
    div.onclick=()=>window.open(item.link,'_blank','noopener,noreferrer');
    moviesEl.appendChild(div);
  });
}
