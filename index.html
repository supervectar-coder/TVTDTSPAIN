<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SV TDT ESPAÑA</title>

<style>
:root{
  --bg:#ffffff;
  --card:#f5f5f5;
  --muted:#555;
  --highlight:#e60000;
  --font-size:16px;
}

body{
  font-family:Inter,system-ui;
  background:#ffffff;
  color:#111;
  margin:0;
  padding:16px;
  font-size: var(--font-size);
  overflow-x:hidden;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:16px;
}

h1{
  font-size:20px;
  margin:0;
  color:var(--highlight);
  font-weight:900;
}

input[type=search]{
  padding:12px 16px;
  border-radius:10px;
  border:1px solid #ccc;
  background:#fff;
  color:#000;
  font-weight:bold;
  font-size:16px;
  margin-bottom:12px;
  width:100%;
}

h2{
  margin-top:24px;
  color:var(--highlight);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;
  scroll-behavior:smooth;
  overflow-x:auto;
}

.card{
  cursor:pointer;
  border-radius:8px;
  overflow:hidden;
  outline:none;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:var(--card);
  padding:8px;
}

.card:hover, .card:focus{
  transform: scale(1.05);
  box-shadow:0 8px 20px rgba(230,0,0,0.4);
}

.img{
  width:100%;
  max-height:120px;
  object-fit:contain;
  border-radius:8px;
  background:#fff;
  display:block;
  margin-bottom:8px;
  transition: transform 0.2s ease;
}

.card:hover img{
  transform: scale(1.08);
}

.title{
  font-weight:700;
  font-size:14px;
  margin-top:4px;
  text-align:center;
}

.meta{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
  text-align:center;
}

.grid::-webkit-scrollbar{
  display:none;
}
</style>
</head>

<header>

// ===== Función para renderizar todos los canales =====
function renderChannels(channels, gridId){
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';
  channels.forEach(ch => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = ch.link;
    card.target = '_blank';
    card.innerHTML = `
      <img class="img" src="${ch.poster}" alt="${ch.title}" />
      <div class="title">${ch.title}</div>
    `;
    grid.appendChild(card);
  });
}

// ===== Función para filtrar =====
function filterChannels(inputId, channels, gridId){
  const search = document.getElementById(inputId);
  search.addEventListener('input', ()=>{
    const filtered = channels.filter(c=>c.title.toLowerCase().includes(search.value.toLowerCase()));
    renderChannels(filtered, gridId);
  });
}

// ===== Inicialización =====
renderChannels(nationalChannels,'movies-grid');
renderChannels(regionalChannels,'regional-grid');
renderChannels(localChannels, "local-grid");
renderChannels(localChannels2, "local-grid2");

renderChannels(localChannels32, "local-grid32");
renderChannels(localChannels4, "local-grid4");
renderChannels(localChannels5, "local-grid5");
filterChannels('regional-search', regionalChannels, 'regional-grid');
</script>
